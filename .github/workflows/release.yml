# Package wereadlite.koplugin and publish a GitHub Release from the
# version declared in _meta.lua (must match wereadlite/config.lua VERSION).
#
# Release notes come from CHANGELOG.md section matching that version
# (e.g. ## [0.2.1] - ...). Keep Unreleased notes out of the shipped body.
#
# Triggers:
#   - Manual: Actions → Release → Run workflow
#   - Tag push: git tag v0.1.0 && git push origin v0.1.0
#     (tag must equal v{VERSION} from _meta.lua)

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          META_FILE="wereadlite.koplugin/_meta.lua"
          CONF_FILE="wereadlite.koplugin/wereadlite/config.lua"
          if [[ ! -f "$META_FILE" ]]; then
            echo "::error::missing $META_FILE"
            exit 1
          fi
          META_VER="$(sed -n 's/.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$META_FILE" | head -n1)"
          CONF_VER="$(sed -n 's/.*VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$CONF_FILE" | head -n1 || true)"
          if [[ -z "$META_VER" ]]; then
            echo "::error::could not parse version from $META_FILE"
            exit 1
          fi
          if [[ ! "$META_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version '$META_VER' (expect semver like 0.1.0)"
            exit 1
          fi
          if [[ -n "$CONF_VER" && "$META_VER" != "$CONF_VER" ]]; then
            echo "::error::version mismatch: _meta.lua=$META_VER config.lua=$CONF_VER"
            exit 1
          fi
          {
            echo "version=$META_VER"
            echo "tag=v$META_VER"
            echo "asset=wereadlite.koplugin-v${META_VER}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $META_VER (tag v$META_VER)"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          REF_TAG="${GITHUB_REF#refs/tags/}"
          EXPECT="${{ steps.ver.outputs.tag }}"
          if [[ "$REF_TAG" != "$EXPECT" ]]; then
            echo "::error::pushed tag '$REF_TAG' != plugin version tag '$EXPECT'"
            exit 1
          fi

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          CHANGELOG="CHANGELOG.md"
          BODY_FILE="$GITHUB_WORKSPACE/RELEASE_BODY.md"
          if [[ ! -f "$CHANGELOG" ]]; then
            echo "::error::missing $CHANGELOG"
            exit 1
          fi
          # Extract "## [VERSION] ..." through the line before the next "## ".
          SECTION="$(awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            $0 ~ ("^## \\[" ver "\\]") {
              found = 1
              print
              next
            }
            found && /^## / { exit }
            found { print }
          ' "$CHANGELOG")"
          if [[ -z "${SECTION//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no section for version $VERSION (expect '## [$VERSION] - YYYY-MM-DD')"
            exit 1
          fi
          {
            printf '%s\n\n' "$SECTION"
            echo "---"
            echo
            echo "### 安装"
            echo
            echo "将 \`wereadlite.koplugin-v${VERSION}.zip\` 解压到 KOReader 的 \`plugins/\` 目录。"
            echo
            echo "请勿打包进 \`data/\`、\`cache/\`（会话与缓存数据）。"
          } > "$BODY_FILE"
          echo "----- release body -----"
          cat "$BODY_FILE"
          echo "body_path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ASSET="${{ steps.ver.outputs.asset }}"
          STAGE="$(mktemp -d)"
          rsync -a \
            --exclude 'data/' \
            --exclude 'cache/' \
            --exclude '.DS_Store' \
            --exclude '*.sqlite3' \
            --exclude '*.sqlite3-*' \
            --exclude '*.sqlite3-journal' \
            "wereadlite.koplugin/" "$STAGE/wereadlite.koplugin/"
          (
            cd "$STAGE"
            zip -r "$GITHUB_WORKSPACE/$ASSET" wereadlite.koplugin
          )
          sha256sum "$ASSET" | tee "${ASSET}.sha256"
          unzip -l "$ASSET" | head -n 40
          echo "Packaged $(du -h "$ASSET" | awk '{print $1}')"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: wereadlite v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            ${{ steps.ver.outputs.asset }}
            ${{ steps.ver.outputs.asset }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
